<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#581c87" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Emas-Custom & Cicilan BPRS - Raja Emas Indonesia</title>
    <meta name="description" content="Platform Pemesanan Emas Custom Perorangan Cabang REI dan Pembiayaan Cicilan Emas Konsorsium BPRS Terhubung CRM & Dasbor Mitra" />
    <link rel="icon" type="image/png" href="https://images.glints.com/unsafe/glints-dashboard.oss-ap-southeast-1.aliyuncs.com/company-logo/1871f1632174b485181d942f9d5e61b6.png" />
    <script>
      // Terapkan tema sebelum React render agar tidak ada kedipan mode terang.
      try {
        var t = localStorage.getItem('rei_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased selection:bg-purple-200 selection:text-purple-900 dark:bg-[#0e0c14] dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
